<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 0.1.125: script-src is 'self' 'wasm-unsafe-eval' only. The
         background-removal engine that needed 'unsafe-eval' (its ONNX
         backend generates code at runtime) moved into its own hidden
         window, renderer/bg-worker.html — the one document whose policy
         allows it (main/bgRemovalWindow.js). Do not put it back here. -->
    <!-- v0.49.33: dropped `https://api.remove.bg` from connect-src.
         The paid bg-removal engine was removed in this release;
         staticimgly.com is the only third-party host that needs
         whitelisting now (for the local @imgly model download). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' app-image: data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: http://localhost:* https://staticimgly.com app-image: data: blob:;" />
    <title>Business Studio KH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
