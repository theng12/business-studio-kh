<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-title" content="Pack" />
<meta name="theme-color" content="#111114" />
<meta name="referrer" content="no-referrer" />
<title>Pack · Media Studio KH</title>
<!-- Packing bench page (/pack). Source: webclient/pack/{index.html,logic.js,app.js};
     scripts/build-webclient.js inlines the scripts and writes
     main/packWebclientHtml.js. Edit these files, never the generated one. -->
<style>
:root {
  --bg: #f4f4f5; --card: #ffffff; --text: #111114; --muted: #5b5b66; --line: #e2e2e6;
  --brand: #111114; --brand-text: #ffffff; --soft: #ececef;
  --ok: #047857; --ok-soft: #d1fae5; --warn: #b45309; --warn-soft: #fef3c7; --bad: #be123c; --bad-soft: #ffe4e6;
  --radius: 14px; --gap: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Khmer", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --card: #1c1c21; --text: #f4f4f5; --muted: #a1a1aa; --line: #2e2e35;
    --brand: #f4f4f5; --brand-text: #111114; --soft: #2a2a31;
    --ok: #34d399; --ok-soft: #063d2c; --warn: #fbbf24; --warn-soft: #3d2b05; --bad: #fb7185; --bad-soft: #43111d;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, label, input { touch-action: manipulation; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.55; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
.bar__title { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar__btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-size: 15px; }
.bar__back { font-size: 22px; padding: 2px 14px; }
main { padding: 16px; max-width: 720px; margin: 0 auto; }
h1 { font-size: 22px; line-height: 1.4; margin: 4px 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.counters { font-weight: 700; font-size: 18px; margin: 2px 0 12px; }
.tabs { display: grid; grid-auto-flow: column; gap: 6px; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.tabs button { border: 0; background: none; border-radius: 9px; min-height: 44px; font-size: 16px; }
.tabs button.is-on { background: var(--card); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.list { display: grid; gap: 8px; }
.card { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card__t { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.card__s { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted); }
.badge--bad { background: var(--bad-soft); color: var(--bad); }
.notice { border-radius: var(--radius); padding: 12px 14px; margin-bottom: var(--gap); }
.notice--bad { background: var(--bad-soft); color: var(--bad); }
.notice--ok { background: var(--ok-soft); color: var(--ok); }
.notice--warn { background: var(--warn-soft); color: var(--warn); }
.notice b { display: block; font-size: 20px; }
.line { display: grid; grid-template-columns: 92px 1fr; gap: 12px; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; }
.line.is-done { border-color: var(--ok); background: var(--ok-soft); }
.line.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.line__img { width: 92px; height: 92px; border-radius: 10px; background: var(--soft); object-fit: cover; display: block; }
.line__img--empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; }
.line__t { font-weight: 700; overflow-wrap: anywhere; }
.line__s { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.line__n { font-size: 18px; font-weight: 700; margin-top: 4px; }
.scan { width: 100%; font: inherit; font-size: 20px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); margin: var(--gap) 0; }
.big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border: 0; border-radius: var(--radius); background: var(--brand); color: var(--brand-text); font-size: 19px; font-weight: 700; padding: 10px 16px; }
.big:disabled { opacity: .45; }
.big--soft { background: var(--soft); color: var(--text); }
.photo-slot { position: relative; }
.photo-slot input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.photo-preview { width: 100%; max-height: 46vh; object-fit: contain; border-radius: var(--radius); background: var(--soft); display: block; margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.is-on { opacity: 1; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.textin { width: 100%; font: inherit; font-size: 20px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
</style>
</head>
<body>
<header class="bar">
  <button type="button" class="bar__btn bar__back" id="backBtn" hidden aria-label="Back">&#8249;</button>
  <div class="bar__title" id="barTitle"></div>
</header>
<main id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
/*@INLINE logic.js*/
</script>
<script>
/*@INLINE app.js*/
</script>
</body>
</html>
